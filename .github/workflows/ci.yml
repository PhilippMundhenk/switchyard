name: CI

# Every push to main and every PR: lint, tests with the coverage gate, browser tests,
# documentation screenshots, container build + smoke test. Publishing: release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: MQTT broker (mosquitto) for the Home Assistant tests
        run: |
          sudo apt-get install -y --no-install-recommends mosquitto
          printf 'listener 18830 127.0.0.1\nallow_anonymous true\n' | sudo tee /etc/mosquitto/conf.d/switchyard-test.conf
          sudo systemctl restart mosquitto
          for i in $(seq 1 20); do nc -z 127.0.0.1 18830 && break; sleep 0.5; done
      - name: Lint
        run: ruff check . && ruff format --check . && python tools/check_js.py
      - name: Tests with the 95 % coverage gate
        env: { SWITCHYARD_TEST_MQTT_PORT: "18830" }
        run: pytest -m "not e2e" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e tests/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    name: Documentation screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python tools/screenshots.py
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/*.png
          retention-days: 14

  home-assistant:
    name: Discovery messages pass Home Assistant's schemas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install homeassistant paho-mqtt
      - run: python tools/validate_ha_discovery.py

  consistency:
    name: Docs match the code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, issues: read }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 tools/consistency_check.py --config tools/consistency.json

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: switchyard:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health, login, discovery, 401, non-root)
        run: SKIP_BUILD=1 IMAGE=switchyard:smoke bash tools/smoke.sh
