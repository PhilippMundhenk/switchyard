name: Release

#   main branch  -> ghcr.io/<owner>/switchyard:latest, :main, :sha-<short>
#   tag vX.Y.Z   -> gates, then :X.Y.Z, :X.Y, :latest + GitHub release with wheel and notes

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/switchyard

jobs:
  gates:
    name: Gates before a release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]" build
      - run: ruff check . && ruff format --check . && python tools/check_js.py
      - run: python tools/consistency_check.py --version ${GITHUB_REF_NAME#v}
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: pytest -m "not e2e" --cov
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e tests/e2e
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/*, retention-days: 7 }

  image:
    name: Build and push image
    needs: gates
    if: ${{ !cancelled() && (needs.gates.result == 'success' || needs.gates.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gates, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Container image: `${{ env.IMAGE }}:${{ github.ref_name }}` (also `:latest`).
            See [CHANGELOG.md](CHANGELOG.md) for the details.
