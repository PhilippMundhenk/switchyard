# Host networking lets Switchyard search the network for switches (a UDP broadcast).
# Without the search, a bridged network works too: remove network_mode, publish the web port
#   ports:
#     - "8080:8080"
# and add every switch by its IP address. See docs/DEPLOYMENT.md, "Docker".
services:
  switchyard:
    image: ghcr.io/philippmundhenk/switchyard:latest
    network_mode: host
    restart: unless-stopped
    # The container runs as user 10001: before the first start, give it the folder with
    #   mkdir -p data && sudo chown 10001:10001 data
    # or run as your own user instead: user: "1000:1000" (see docs/DEPLOYMENT.md, "Data folder").
    volumes:
      - ./data:/data
    environment:
      # Password of the web interface. Empty: one is generated and printed once in the log.
      # SWITCHYARD_AUTH_PASSWORD: "change-me"
      # SWITCHYARD_SERVER_PORT: "8080"
      # Search only these network interfaces (comma separated):
      # SWITCHYARD_NSDP_INTERFACES: "eth0"
      # Switches on other subnets or with a bridged network (directed broadcast or unicast addresses):
      # SWITCHYARD_NSDP_TARGETS: "192.168.5.255"
      # Run four simulated switches instead of using the network:
      # SWITCHYARD_DEMO_ENABLED: "true"
      SWITCHYARD_LOG_LEVEL: info
