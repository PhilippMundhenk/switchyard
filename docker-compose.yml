# Switchyard needs UDP broadcast on the switches' network, so it uses host networking.
services:
  switchyard:
    image: ghcr.io/philippmundhenk/switchyard:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      # Password of the web interface. Empty: one is generated and printed once in the log.
      # SWITCHYARD_AUTH_PASSWORD: "change-me"
      # SWITCHYARD_SERVER_PORT: "8080"
      # Search only these network interfaces (comma separated):
      # SWITCHYARD_NSDP_INTERFACES: "eth0"
      # Switches on other subnets (directed broadcast or unicast addresses):
      # SWITCHYARD_NSDP_TARGETS: "192.168.5.255"
      # Run four simulated switches instead of using the network:
      # SWITCHYARD_DEMO_ENABLED: "true"
      SWITCHYARD_LOG_LEVEL: info
