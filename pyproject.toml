[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "switchyard"
dynamic = ["version"]
description = "Web manager for NSDP-managed (ProSAFE Plus) switches"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Philipp Mundhenk" }]
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "paho-mqtt>=2.1"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "playwright>=1.47",
  "pytest-playwright>=0.10.0",
  "amqtt>=0.11",
]

[project.scripts]
switchyard = "switchyard.__main__:main"

[tool.hatch.version]
path = "src/switchyard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/switchyard"]

[tool.ruff]
extend-exclude = ["tools/consistency_check.py"]  # vendored from the release skill
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tools/make_icons.py" = ["E501"]
"src/switchyard/diff.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-ra"
markers = ["e2e: drives the real UI in a browser"]

[tool.coverage.run]
source = ["switchyard"]
branch = false

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
